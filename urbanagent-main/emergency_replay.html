<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UrbanAgent · 应急调度回放</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #121925;
    --panel-2: #1a2336;
    --border: #2a3854;
    --fg: #eef3fb;
    --dim: #9aa8c0;
    --cyan: #5fd9fb;
    --green: #62f0a8;
    --amber: #ffd479;
    --red: #ff8595;
    --purple: #d8aaff;
    --blue: #9cc0ff;
    --orange: #ffb478;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background:
      radial-gradient(1200px 600px at 70% -10%, rgba(52,212,240,.08), transparent 60%),
      radial-gradient(900px 500px at 10% 110%, rgba(199,146,234,.07), transparent 60%),
      var(--bg);
    color: var(--fg);
    font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", "Consolas", ui-monospace, monospace;
    min-height: 100vh;
  }
  .wrap {
    max-width: 980px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }
  .window {
    background: linear-gradient(180deg, var(--panel) 0%, #0b0f1a 100%);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 30px 80px -30px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.02) inset;
    overflow: hidden;
  }
  .titlebar {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 16px;
    background: linear-gradient(180deg, #131a2b, #0e1320);
    border-bottom: 1px solid var(--border);
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot.r { background: #ff5f57; } .dot.y { background: #febc2e; } .dot.g { background: #28c840; }
  .title {
    flex: 1; text-align: center; color: var(--dim);
    font-size: 12.5px; letter-spacing: .04em;
  }
  .title b { color: var(--fg); font-weight: 600; }
  .live {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--green); font-size: 11px; letter-spacing: .08em;
  }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }

  .term {
    padding: 20px 24px 28px;
    height: 70vh;
    min-height: 460px;
    overflow-y: auto;
    font-size: 15px;
    line-height: 1.8;
    letter-spacing: .01em;
    scroll-behavior: smooth;
  }
  .term::-webkit-scrollbar { width: 10px; }
  .term::-webkit-scrollbar-thumb { background: #1c2640; border-radius: 6px; }
  .term::-webkit-scrollbar-track { background: transparent; }

  /* ---- content blocks ---- */
  .ln { white-space: pre-wrap; word-break: break-word; }
  .indent { padding-left: 22px; }
  .indent2 { padding-left: 40px; }
  .dim { color: var(--dim); }
  .cyan { color: var(--cyan); } .green { color: var(--green); }
  .amber { color: var(--amber); } .red { color: var(--red); }
  .purple { color: var(--purple); } .blue { color: var(--blue); }
  .orange { color: var(--orange); }
  .key { color: var(--blue); }

  .cmd { margin: 14px 0 4px; }
  .cmd .prompt { color: var(--green); }
  .cmd .path { color: var(--purple); }
  .cmd .sigil { color: var(--cyan); }

  /* ===== 阶段分隔：终端风格彩色标签 + 横向 rule ===== */
  .ph {
    --acc: var(--cyan);
    display: flex; align-items: center; gap: 12px;
    margin: 26px 0 10px;
  }
  .ph .bar  { color: var(--acc); font-weight: 700; letter-spacing: -2px; }
  .ph .name { color: var(--acc); font-weight: 700; font-size: 16px; letter-spacing: .14em; }
  .ph .rule { flex: 1; height: 0; border-top: 1px solid #25324f; }
  .ph .desc { color: var(--dim); font-size: 13px; white-space: nowrap; }
  .ph.p1 { --acc: var(--purple); }
  .ph.p2 { --acc: var(--blue); }
  .ph.p3 { --acc: var(--green); }

  /* 阶段内小标签 */
  .lbl { margin: 14px 0 4px; color: var(--dim); letter-spacing: .03em; }
  .lbl .k { color: var(--cyan); font-weight: 600; }
  .lbl.plan   .k { color: var(--orange); }
  .lbl.exec   .k { color: var(--cyan); }
  .lbl.report .k { color: var(--green); }
  .lbl.return .k { color: var(--blue); }

  .k { color: var(--cyan); font-weight: 600; }

  /* 树状列表（├─ └─） */
  .row { white-space: pre-wrap; word-break: break-word; }
  .tree { color: #46587e; }
  .nm { color: var(--fg); font-weight: 600; }

  /* 状态标签 [ok] [infeasible] [applied] */
  .tag { font-weight: 600; }
  .tag::before { content: "["; color: var(--dim); font-weight: 400; }
  .tag::after  { content: "]"; color: var(--dim); font-weight: 400; }
  .tag.ok   { color: var(--green); }
  .tag.bad  { color: var(--red); }
  .tag.info { color: var(--cyan); }

  /* 思考中 loading 动画 */
  .loading {
    margin: 22px 0 10px;
    color: var(--purple);
    font-weight: 700;
    font-size: 15px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .loading .spin { color: var(--cyan); }
  .loading .ell::after {
    content: "";
    animation: ell 1.1s steps(4, end) infinite;
  }
  @keyframes ell { 0%{content:""} 25%{content:"·"} 50%{content:"··"} 75%{content:"···"} 100%{content:""} }

  .alert {
    margin: 10px 0 4px;
    color: var(--red);
    font-weight: 700;
    letter-spacing: .02em;
  }
  .alert .fire { animation: flick .9s infinite alternate; }
  @keyframes flick { from{filter:drop-shadow(0 0 1px #ff6b81)} to{filter:drop-shadow(0 0 7px #ff9e64)} }

  .done {
    margin-top: 16px;
    color: var(--green);
    font-weight: 700;
    letter-spacing: .02em;
  }

  .tw.typing::after {
    content: "▋";
    color: var(--cyan);
    margin-left: 1px;
    animation: blink .9s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ---- controls ---- */
  .bar {
    display: flex; align-items: center; gap: 10px;
    margin-top: 16px;
  }
  .bar .spacer { flex: 1; }
  button {
    font-family: inherit; font-size: 12.5px;
    color: var(--fg);
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 14px;
    cursor: pointer;
    transition: .15s;
  }
  button:hover { border-color: var(--cyan); color: var(--cyan); }
  button.primary { border-color: rgba(52,212,240,.5); color: var(--cyan); }
  .hint { color: var(--dim); font-size: 12px; }
  .legend { color: var(--dim); font-size: 11.5px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="window">
      <div class="titlebar">
        <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
        <span class="title">urbanagent — <b>patrol-fire-demo</b> — 应急调度回放</span>
        <span class="live"><i></i> LIVE</span>
      </div>
      <div class="term" id="term"></div>
    </div>

    <div class="bar">
      <button class="primary" id="replay">↻ 重新播放</button>
      <button id="skip">⏩ 跳过动画</button>
      <span class="spacer"></span>
      <span class="legend">
        <span class="tag ok">ok</span>
        <span class="tag bad">infeasible</span>
        <span class="tag info">applied</span>
      </span>
    </div>
  </div>

<script>
const term = document.getElementById('term');

// 每一步：html 片段（其中 .tw 文本会被逐字"流式"打出），以及结束后的停顿。
const SCRIPT = [
  { d: 120, html:`<div class="cmd"><span class="prompt">urbanagent</span> <span class="path">~/incident</span> <span class="sigil">❯</span> <span class="tw">patrol-fire-demo --url http://127.0.0.1:5000 --loop</span></div>` },
  { d: 90,  html:`<div class="ln dim"><span class="tw">● 巡逻中 · UAV-01/02/03 沿火情监视线巡飞…</span></div>` },
  { d: 260, html:`<div class="alert"><span class="fire">🔥</span> <span class="tw">检测到火情 · fire-001 · 严重度 HIGH · 状态 OPEN</span></div>` },

  // ═════════ 阶段 ① 认知 ═════════
  // "思考中" loading，结束后收敛为 ① 认知 阶段分隔
  { type:'loading', text:'思考中', dur: 1600, d: 240,
    resolveHtml:`<div class="ph p1"><span class="bar">▌</span><span class="name">① 认知</span><span class="rule"></span><span class="desc">理解火情 · 判断介入 · 明确目标</span></div>` },

  { d: 80,  html:`<div class="row"><span class="k">门控</span>  <span class="green tw">介入</span> <span class="dim">·</span> 优先级 <span class="amber tw">HIGH</span> <span class="dim">·</span> 触发 <span class="orange tw">fire</span></div>` },
  { d: 150, html:`<div class="row indent dim"><span class="tree">└</span> <span class="tw">高严重度火情 fire-001 处于开放状态，需立即启动协同调度以控制火势。</span></div>` },
  { d: 100, html:`<div class="row"><span class="k">意图</span>  <span class="cyan tw">multi_agent_coordination</span> <span class="dim">·</span> 目标 <span class="orange tw">fire-001</span></div>` },
  { d: 60,  html:`<div class="row"><span class="k">约束</span>  severity=<span class="amber">high</span>  status=<span class="amber">open</span></div>` },
  { d: 180, html:`<div class="row indent dim"><span class="tree">└</span> <span class="tw">incident_id 已知且信息完备，进入多智能体协同调度。</span></div>` },

  // ═════════ 阶段 ② 拆解 ═════════
  { d: 200, html:`<div class="ph p2"><span class="bar">▌</span><span class="name">② 拆解</span><span class="rule"></span><span class="desc">拆分角色子任务 · 子智能体推理</span></div>` },

  { d: 80, html:`<div class="lbl"><span class="k">角色子目标</span> <span class="dim">4 roles</span></div>` },
  { d: 60, html:`<div class="row"><span class="tree">├─</span> 🚦 <span class="nm">traffic_signal</span>　 <span class="dim tw">信号 TL-9…TL-23 切绿放行</span></div>` },
  { d: 50, html:`<div class="row"><span class="tree">├─</span> 🚓 <span class="nm">police_car</span>　　　 <span class="dim tw">封控外围 · 无可用资源</span></div>` },
  { d: 50, html:`<div class="row"><span class="tree">├─</span> 🚙 <span class="nm">unmanned_vehicle</span> <span class="dim tw">UGV-01 → 灭火 / 后勤</span></div>` },
  { d: 80, html:`<div class="row"><span class="tree">└─</span> 🛸 <span class="nm">drone</span>　　　　　 <span class="dim tw">UAV-01 / 02 / 03 → 侦察 / 热成像</span></div>` },

  { d: 110, html:`<div class="lbl"><span class="k">子智能体推理</span></div>` },
  { d: 60, html:`<div class="row"><span class="tree">├─</span> traffic_signal　 <span class="tag ok">ok</span> <span class="dim tw">TL-9…TL-23 全部切绿，进场路径畅通</span></div>` },
  { d: 60, html:`<div class="row"><span class="tree">├─</span> police_car　　　 <span class="tag bad">infeasible</span> <span class="dim tw">无 police_car，子任务跳过</span></div>` },
  { d: 60, html:`<div class="row"><span class="tree">├─</span> unmanned_vehicle <span class="tag ok">ok</span> <span class="dim tw">UGV-01 部署至 fire-001 灭火</span></div>` },
  { d: 80, html:`<div class="row"><span class="tree">└─</span> drone　　　　　　 <span class="tag ok">ok</span> <span class="dim tw">UAV-01/02/03 空中侦察与热成像</span></div>` },

  // ═════════ 阶段 ③ 执行 ═════════
  { d: 200, html:`<div class="ph p3"><span class="bar">▌</span><span class="name">③ 执行</span><span class="rule"></span><span class="desc">生成调度计划 · 下发批次 · 灭火返航</span></div>` },

  { d: 100, html:`<div class="lbl plan"><span class="k">调度计划</span> <span class="dim">3 actions</span></div>` },
  { d: 60, html:`<div class="row"><span class="tree">├─</span> <span class="orange">①</span> dispatch_vehicle <span class="cyan">UGV-01</span> → (25.3, 27.9)　<span class="dim tw">fire_suppression</span></div>` },
  { d: 60, html:`<div class="row"><span class="tree">├─</span> <span class="orange">②</span> dispatch_drone　 <span class="cyan">UAV-01</span> → (15.3, 24.4)　<span class="dim tw">aerial_recon</span></div>` },
  { d: 80, html:`<div class="row"><span class="tree">└─</span> <span class="orange">③</span> dispatch_vehicle <span class="cyan">UGV-01</span> → (25.3, 27.9)　<span class="dim tw">force_extinguish</span></div>` },

  { d: 110, html:`<div class="lbl exec"><span class="k">下发并执行</span></div>` },
  { d: 200, html:`<div class="row"><span class="green">▸</span> dispatch_vehicle <span class="cyan">UGV-01</span> <span class="dim tw"> …… </span><span class="tag info">applied</span> <span class="green">✓</span></div>` },
  { d: 200, html:`<div class="row"><span class="green">▸</span> dispatch_drone　 <span class="cyan">UAV-01</span> <span class="dim tw"> …… </span><span class="tag info">applied</span> <span class="green">✓</span></div>` },
  { d: 200, html:`<div class="row"><span class="green">▸</span> dispatch_vehicle <span class="cyan">UGV-01</span> <span class="dim">(extinguish)</span><span class="dim tw"> … </span><span class="tag info">applied</span> <span class="green">✓</span></div>` },
  { d: 140, html:`<div class="row green"><span class="tw">  ✔ 批次完成 · 3/3 步成功，约束已满足</span></div>` },

  { d: 110, html:`<div class="lbl report"><span class="k">调度摘要</span></div>` },
  { d: 60,  html:`<div class="row indent"><span class="tree">├</span> <span class="purple">交通信号</span> <span class="dim tw">TL-9…TL-23 已切绿，进场路径畅通</span></div>` },
  { d: 60,  html:`<div class="row indent"><span class="tree">├</span> <span class="purple">无人车</span>　 <span class="dim tw">UGV-01 抵达 fire-001 完成灭火</span></div>` },
  { d: 100, html:`<div class="row indent"><span class="tree">└</span> <span class="purple">无人机</span>　 <span class="dim tw">UAV-01/02/03 实时态势与热成像</span></div>` },

  { d: 110, html:`<div class="lbl return"><span class="k">灭火完成 · 单位返航</span></div>` },
  { d: 180, html:`<div class="row"><span class="blue">▸</span> return_vehicle <span class="cyan">UGV-01</span> <span class="dim tw"> …… </span><span class="green">✓</span></div>` },
  { d: 180, html:`<div class="row"><span class="blue">▸</span> return_drone　 <span class="cyan">UAV-01</span> <span class="dim tw"> …… </span><span class="green">✓</span></div>` },
  { d: 120, html:`<div class="row dim"><span class="tw">  全部单位已归位。</span></div>` },

  { d: 0, html:`<div class="done"><span class="tw">✔ 任务闭环完成 · 巡逻 → 发现火情 → 协同调度 → 灭火 → 返航</span></div>` },
];

let SKIP = false;
let running = false;

const sleep = (ms) => new Promise(r => setTimeout(r, SKIP ? 0 : ms));

function scrollBottom() { term.scrollTop = term.scrollHeight; }

async function typeInto(el, text) {
  el.classList.add('typing');
  el.textContent = '';
  if (SKIP) { el.textContent = text; el.classList.remove('typing'); return; }
  for (let i = 0; i < text.length; i++) {
    el.textContent += text[i];
    if (i % 3 === 0) scrollBottom();
    // 标点处稍作停顿，更像"思考"
    const c = text[i];
    let s = 13;
    if ('，。；、：（）'.includes(c)) s = 70;
    else if ('.,;:'.includes(c)) s = 50;
    await sleep(s);
  }
  el.classList.remove('typing');
  scrollBottom();
}

function buildEl(html) {
  const tpl = document.createElement('template');
  tpl.innerHTML = html.trim();
  const el = tpl.content.firstElementChild;
  // 把 .tw 的文本抽出来，清空，待会儿逐字打。
  el.querySelectorAll('.tw').forEach(s => {
    s.dataset.text = s.textContent;
    s.textContent = '';
  });
  return el;
}

async function runLoading(step) {
  const el = document.createElement('div');
  el.className = 'loading';
  el.innerHTML = `<span class="spin">⠋</span><span>${step.text}</span><span class="ell"></span>`;
  term.appendChild(el);
  scrollBottom();

  if (!SKIP) {
    const frames = ['⠋','⠙','⠹','⠸','⠼','⠴','⠦','⠧','⠇','⠏'];
    const spin = el.querySelector('.spin');
    let i = 0;
    const timer = setInterval(() => { spin.textContent = frames[i++ % frames.length]; }, 80);
    await sleep(step.dur);
    clearInterval(timer);
  }

  // 思考结束：loading 收敛为阶段横幅
  el.replaceWith(buildEl(step.resolveHtml));
  scrollBottom();
}

async function run() {
  running = true;
  term.innerHTML = '';
  SKIP = false;
  for (const step of SCRIPT) {
    if (step.type === 'loading') {
      await runLoading(step);
      await sleep(step.d);
      continue;
    }
    const el = buildEl(step.html);
    term.appendChild(el);
    scrollBottom();
    const tws = el.querySelectorAll('.tw');
    for (const t of tws) await typeInto(t, t.dataset.text);
    await sleep(step.d);
  }
  running = false;
}

document.getElementById('replay').addEventListener('click', () => { if (!running) run(); });
document.getElementById('skip').addEventListener('click', () => { SKIP = true; });

run();
</script>
</body>
</html>
